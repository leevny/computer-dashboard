[package]
name = "sys-gauge"
version = "0.1.0"
license = "MIT"
edition = "2024"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
egui_bg_layer = "0.37.0"
egui_glow = "0.37.0"
raw-window-handle = "0.6.2"
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }
tray-icon = "0.26.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target.x86_64-pc-windows-gnu.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }
